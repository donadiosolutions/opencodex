interface:
  display_name: "Update OCX"
  short_description: "Update the local OCX proxy and remote Hub via GitOps"
  default_prompt: "Use $update-ocx for the full update: merge the latest tagged stable upstream release into custom through a reviewed PR, publish and verify the remote release, install its downloaded tarball with the exact single-shell proxy handoff, verify local recovery and built-in openai routing/model discovery, then delegate to donadiosolutions/bcdn. Prohibit non-atomic scale-to-zero and recovery that needs another model/tool call; require an independently owned recovery operation before any quiescing. Monitor until the replacement Pod runs the verified image and authenticated inference completes through the actual relay used by this Codex session. Pod readiness or Hub-local health alone never establishes recovery."
