name: Numbered fork release

on:
  workflow_dispatch:
    inputs:
      source_branch:
        description: Same-repository source branch
        type: string
        required: true
        default: custom

permissions: {}

# Includes reservation, publication and latest promotion; an older rerun cannot race.
concurrency:
  group: bcdn-release
  cancel-in-progress: false

jobs:
  reserve:
    runs-on: blacksmith-4vcpu-ubuntu-2604
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
    outputs:
      release_tag: ${{ steps.reserve.outputs.release_tag }}
      release_id: ${{ steps.reserve.outputs.release_id }}
      source_sha: ${{ steps.reserve.outputs.source_sha }}
      source_branch: ${{ steps.reserve.outputs.source_branch }}
      upstream_tag: ${{ steps.reserve.outputs.upstream_tag }}
      upstream_sha: ${{ steps.reserve.outputs.upstream_sha }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Install pinned Cosign for reservation signing
        shell: bash
        run: bash .github/scripts/bcdn-image-tools.sh cosign
      - id: reserve
        uses: actions/github-script@d746ffe35508b1917358783b479e04febd2b8f71 # v9.0.0
        env:
          SOURCE_BRANCH: ${{ inputs.source_branch }}
          BCDN_COSIGN: ${{ runner.temp }}/bcdn-image-tools/cosign
        with:
          script: await require('./.github/scripts/bcdn-release.cjs').reserve({github, context, core})

  image:
    needs: reserve
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    uses: ./.github/workflows/bcdn-image.yml
    with:
      release_tag: ${{ needs.reserve.outputs.release_tag }}
      source_sha: ${{ needs.reserve.outputs.source_sha }}
      source_branch: ${{ needs.reserve.outputs.source_branch }}
      upstream_tag: ${{ needs.reserve.outputs.upstream_tag }}
      upstream_sha: ${{ needs.reserve.outputs.upstream_sha }}

  publish:
    needs: [reserve, image]
    runs-on: blacksmith-4vcpu-ubuntu-2604
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Recheck release actors before publication
        uses: actions/github-script@d746ffe35508b1917358783b479e04febd2b8f71 # v9.0.0
        env:
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
        with:
          script: |
            const repo = { owner: 'donadiosolutions', repo: 'opencodex' };
            for (const username of new Set([context.actor, process.env.TRIGGERING_ACTOR])) {
              if (!username) throw new Error('Missing release actor');
              const { data } = await github.rest.repos.getCollaboratorPermissionLevel({ ...repo, username });
              if (![data.permission, data.role_name].some(role => ['maintain', 'admin'].includes(role))) {
                throw new Error('Release actor requires maintain or admin access');
              }
            }
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bcdn-evidence
          path: evidence
      - name: Install pinned Cosign for reservation verification
        shell: bash
        run: bash .github/scripts/bcdn-image-tools.sh cosign
      - uses: actions/github-script@d746ffe35508b1917358783b479e04febd2b8f71 # v9.0.0
        env:
          RELEASE_TAG: ${{ needs.reserve.outputs.release_tag }}
          RELEASE_ID: ${{ needs.reserve.outputs.release_id }}
          SOURCE_SHA: ${{ needs.reserve.outputs.source_sha }}
          IMAGE_DIGEST: ${{ needs.image.outputs.digest }}
          EVIDENCE_DIRECTORY: evidence
          BCDN_COSIGN: ${{ runner.temp }}/bcdn-image-tools/cosign
        with:
          script: await require('./.github/scripts/bcdn-release.cjs').finalize({github, context, core})

  latest:
    needs: [reserve, image, publish]
    if: needs.reserve.outputs.source_branch == 'custom'
    runs-on: blacksmith-4vcpu-ubuntu-2604
    timeout-minutes: 5
    permissions:
      contents: read
      packages: write
    steps:
      - name: Recheck release actors before publication
        uses: actions/github-script@d746ffe35508b1917358783b479e04febd2b8f71 # v9.0.0
        env:
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
        with:
          script: |
            const repo = { owner: 'donadiosolutions', repo: 'opencodex' };
            for (const username of new Set([context.actor, process.env.TRIGGERING_ACTOR])) {
              if (!username) throw new Error('Missing release actor');
              const { data } = await github.rest.repos.getCollaboratorPermissionLevel({ ...repo, username });
              if (![data.permission, data.role_name].some(role => ['maintain', 'admin'].includes(role))) {
                throw new Error('Release actor requires maintain or admin access');
              }
            }
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Install pinned Cosign for reservation verification
        shell: bash
        run: bash .github/scripts/bcdn-image-tools.sh cosign
      - uses: actions/github-script@d746ffe35508b1917358783b479e04febd2b8f71 # v9.0.0
        env:
          SOURCE_BRANCH: ${{ needs.reserve.outputs.source_branch }}
          IMAGE_DIGEST: ${{ needs.image.outputs.digest }}
          GH_TOKEN: ${{ github.token }}
          BCDN_COSIGN: ${{ runner.temp }}/bcdn-image-tools/cosign
        with:
          script: await require('./.github/scripts/bcdn-release.cjs').promote({github, context, core})
